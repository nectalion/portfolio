<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t">
  <title id="t">Illustration provisoire : robot sumo vu de dessus sur son ring</title>
  <!-- Illustration provisoire : à remplacer par une photo du robot (images/projet4.jpg) -->
  <rect width="1200" height="700" fill="#212738"/>

  <!-- Ring (dohyo) : disque sombre bordé de blanc -->
  <circle cx="600" cy="350" r="290" fill="#2b3247"/>
  <circle cx="600" cy="350" r="290" fill="none" stroke="#FFFFFF" stroke-width="14"/>

  <!-- Robot vu de dessus -->
  <g transform="translate(600 350) rotate(-18)">
    <!-- Roues -->
    <rect x="-118" y="-112" width="70" height="34" rx="8" fill="#151925"/>
    <rect x="-118" y="78"   width="70" height="34" rx="8" fill="#151925"/>
    <!-- Châssis -->
    <rect x="-110" y="-90" width="190" height="180" rx="18" fill="#F97068"/>
    <!-- Lame avant -->
    <path d="M80 -95 L130 -80 L130 80 L80 95 Z" fill="#FFFFFF"/>
    <!-- Carte électronique -->
    <rect x="-75" y="-55" width="110" height="110" rx="8" fill="#212738" opacity="0.85"/>
    <rect x="-50" y="-22" width="44" height="44" rx="4" fill="#F97068" opacity="0.9"/>
    <circle cx="20" cy="-35" r="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="20" cy="35"  r="6" fill="#FFFFFF" opacity="0.8"/>
    <!-- Capteurs avant -->
    <circle cx="62" cy="-50" r="9" fill="#FFFFFF"/>
    <circle cx="62" cy="50"  r="9" fill="#FFFFFF"/>
  </g>

  <!-- Mention -->
  <text x="600" y="672" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="26" font-weight="600" letter-spacing="3" fill="#FFFFFF" opacity="0.55">PROJET EN COURS</text>
</svg>
